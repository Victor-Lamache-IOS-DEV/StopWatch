name: MagicStopwatch
options:
  bundleIdPrefix: com.victorlamh
  deploymentTarget:
    iOS: "26.0"

targets:
  MagicStopwatch:
    type: application
    platform: iOS
    sources:
      - MagicStopwatch
    info:
      path: MagicStopwatch/Info.plist
      properties:
        CFBundleDisplayName: Clock
        CFBundleName: Clock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorlamache.magicstopwatch
        DEVELOPMENT_TEAM: A63WD37CXZ
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Victor Lamache Dev Profile"
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "6.2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon